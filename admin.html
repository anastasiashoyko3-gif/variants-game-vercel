<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Адмінка — Варіанти</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main class="shell">
    <div class="eyebrow">Party Game</div>
    <h1>Адмінка</h1>

    <section class="card narrow" id="loginCard">
      <h2>Вхід для ведучої</h2>
      <input id="adminPassword" type="password" placeholder="Пароль адмінки" />
      <button id="loginBtn">Увійти</button>
      <p id="loginMsg" class="error"></p>
    </section>

    <section class="card narrow hidden" id="createCard">
      <h2>Створити гру</h2>
      <input id="gameTitle" placeholder="Назва гри" value="Гра Варіанти" />
      <input id="gamePassword" placeholder="Пароль для гравців" value="game123" />
      <input id="hostAvatar" placeholder="Аватарка ведучої, наприклад 👑 або URL фото" value="👑" />

      <div class="actions">
        <button id="createGameBtn">Створити гру</button>
        <button class="secondary" id="openLastBtn">Відкрити останню гру</button>
        <button class="secondary" id="logoutBtn">Вийти</button>
      </div>
    </section>

    <section class="card hidden" id="gameCard">
      <div class="topLine">
        <div>
          <h2 id="gameName">Гра</h2>
          <p class="muted">Інвайт для гравців:</p>
          <div class="invite" id="inviteLink"></div>
        </div>
        <div class="actions rightActions">
          <button class="secondary" id="editQuestionsBtn">Редагувати питання</button>
          <button class="secondary" id="newGameBtn">Нова гра</button>
          <button class="danger" id="deleteGameBtn">Видалити гру</button>
        </div>
      </div>

      <div id="questionEditor" class="hidden editorBlock">
        <h2>Питання гри</h2>
        <p class="muted">
          Фейк ведучої вводиться одразу. У 3 раунді можна додати посилання на фото.
        </p>
        <div id="questionsForm"></div>
        <div class="actions stickyActions">
          <button id="saveQuestionsBtn">Зберегти питання</button>
          <button class="secondary" id="closeEditorBtn">Закрити</button>
        </div>
      </div>

      <section id="hostPanel">
        <h2>Керування грою</h2>
        <div id="adminState" class="miniState"></div>

        <div class="actions">
          <button data-action="show_question">Показати питання</button>
          <button data-action="start_answers">Почати відповіді</button>
          <button data-action="show_options">Показати варіанти</button>
          <button data-action="start_voting">Почати голосування</button>
          <button class="danger" data-action="finish_voting">Завершити голосування</button>
          <button data-action="show_scoreboard">Показати таблицю</button>
          <button data-action="next_question">Наступне питання</button>
        </div>

        <div id="revealPanel"></div>
      </section>

      <section class="grid2">
        <div>
          <h2>Гравці</h2>
          <div id="playersList"></div>
        </div>
        <div>
          <h2>Таблиця</h2>
          <div id="scoreBoard"></div>
        </div>
      </section>
    </section>
  </main>

  <script type="module" src="/js/admin.js"></script>
</body>
</html>
