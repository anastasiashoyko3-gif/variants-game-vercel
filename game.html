<!doctype html>
<html lang="uk">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Гра — Варіанти</title><link rel="stylesheet" href="/css/style.css?v=dot-led-3"/></head>
<body><main class="shell"><div class="eyebrow">Party Game</div><h1>Варіанти</h1>
<section class="card narrow" id="joinCard">
<h2>Увійти в гру</h2>
<input id="playerName" placeholder="Твоє імʼя"/>
<input id="playerPin" placeholder="PIN, наприклад 1234"/>
<input id="playerAvatar" placeholder="Емодзі аватарки, наприклад 🥐"/>
<label class="fileLabel">Фото аватарки з пристрою<input id="playerAvatarFile" type="file" accept="image/*"></label>
<input id="gamePassword" type="password" placeholder="Пароль гри"/>
<button id="joinBtn">Увійти</button><p id="joinMsg" class="error"></p>
</section>
<section class="card hidden" id="playCard"><div class="playerTop"><p class="muted">Гравець: <b id="meName"></b></p><button class="secondary smallBtn" id="leaveBtn">Вийти</button></div><div id="gameState">Завантаження...</div></section>
</main><script type="module" src="/js/player.js?v=dot-led-3"></script></body></html>
