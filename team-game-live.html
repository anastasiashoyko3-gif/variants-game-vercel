<!doctype html>
<html lang="uk">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Командна гра · Екран</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/team-screen.css"></head>
<body class="teamScreen">
<main id="stage" class="teamStage">
  <header id="screenHeader">
    <div class="eyebrow">Party Game</div>
    <h1 id="title">Командна гра</h1>
    <h2 id="round">Очікуємо початку</h2>
  </header>
  <section id="roundContent" class="roundContent">
    <p id="status" class="muted"></p>
    <div id="timer" class="hidden"></div>
    <div id="word" class="hidden"></div>
    <p id="focusNotice" class="muted hidden"></p>
    <div id="board" class="hidden"></div>
  </section>
  <section id="results" class="resultsScreen hidden" aria-label="Таблиця балів">
    <h1 id="resultsTitle"></h1>
    <table id="scoreTable"><thead id="scoreHead"></thead><tbody id="scoreBody"></tbody></table>
    <p id="winner"></p>
  </section>
  <p id="error" class="muted" role="status"></p>
</main>
<script type="module" src="/js/team-game-live.js"></script>
</body></html>
