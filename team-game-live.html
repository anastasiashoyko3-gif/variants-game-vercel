<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Командна гра · Екран</title><link rel="stylesheet" href="/css/style.css"></head><body><main class="shell"><div class="eyebrow">Party Game</div><h1 id="title">Командна гра</h1><section class="card"><h2 id="round">Очікуємо початку</h2><div id="score" style="font-size:clamp(20px,5vw,40px);font-weight:800;text-align:center;margin:24px 0"></div><p id="status" style="text-align:center"></p><div id="timer" style="font-size:clamp(44px,10vw,90px);font-weight:800;text-align:center"></div><div id="word" style="font-size:clamp(24px,6vw,52px);font-weight:800;text-align:center;margin:28px 0"></div><div id="board" style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px"></div><p id="winner" style="font-size:32px;font-weight:800;text-align:center"></p></section><p id="error" class="muted"></p></main><script type="module" src="/js/team-game-live.js"></script></body></html>
