<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Командна гра — попередній перегляд</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#332c41;background:#f8f4fc}*{box-sizing:border-box}body{margin:0;padding:24px}.wrap{max-width:960px;margin:auto}h1{text-align:center}p{line-height:1.5}.muted{color:#746d7e}.bar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:20px 0}button{border:0;border-radius:12px;padding:12px 18px;background:#7556b8;color:white;cursor:pointer;font-size:15px}button.active{background:#3c2869}button.secondary{background:#e9e0f6;color:#382d54}.panel{background:white;padding:24px;border-radius:24px;box-shadow:0 8px 28px #54426912;margin:20px 0}.scores{display:grid;grid-template-columns:1fr 1fr;gap:16px}.team{padding:25px 10px;border-radius:20px;text-align:center;color:white}.team.blue{background:#3e70b7}.team.red{background:#bd5369}.team strong{display:block;font-size:clamp(38px,8vw,72px);margin:10px}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.tile{background:#e9e5ed;color:#302b3a;min-height:76px;padding:6px;overflow-wrap:anywhere}.tile.blue{background:#3e70b7;color:white}.tile.red{background:#bd5369;color:white}.tile.neutral{background:#d2c7b3;color:#29242a}.tile.black{background:#29232e;color:white}.desc{font-size:clamp(21px,3vw,32px);line-height:1.5;text-align:center;padding:24px 4px}.note{background:#fff5df;border-radius:12px;padding:12px} @media(max-width:500px){body{padding:10px}.panel{padding:14px}.grid{gap:4px}.tile{font-size:11px;min-height:58px;padding:3px}}
</style></head><body><div class="wrap"><h1>Командна гра</h1><p class="muted" style="text-align:center">Попередній перегляд екрана глядачів · демо без підключення до бази</p><div class="bar"><button id="r1" onclick="setRound(1)">1 · Асоціації</button><button id="r2" onclick="setRound(2)">2 · Кодові імена</button><button id="r3" onclick="setRound(3)">3 · Описи</button><button id="rf" onclick="setRound(4)">Фінал</button></div><section class="panel"><div id="stage"></div></section><section class="scores"><div class="team blue"><div>Команда 1</div><strong id="score1">8</strong>балів</div><div class="team red"><div>Команда 2</div><strong id="score2">10</strong>балів</div></section><p class="note">Це тільки макет для перевірки вигляду. Кнопки перемикають приклади екранів, а не запускають справжню гру. Справжні бали, таймер і слова будуть надходити з Neon.</p></div>
<script>
let round=1;
const words=['ЛІС','МІСТО','КАВА','ДЕРЕВО','МІСЯЦЬ','СНІГ','КНИГА','ПЛЯЖ','КОРАБЕЛЬ','ВІТЕР','ПАЛАЦ','МУЗИКА','САД','ХМАРА','КОРОНА','ГОДИННИК','КІТ','МОРЕ','КЛЮЧ','ЗІРКА','ШКОЛА','ДОЩ','СОНЦЕ','ТЕАТР','ЛІТАК'];
function setRound(n){round=n;for(let i=1;i<=3;i++)document.getElementById('r'+i).classList.toggle('active',i===n);document.getElementById('rf').classList.toggle('active',n===4);let el=document.getElementById('stage');
if(n===1)el.innerHTML='<h2>Раунд 1 · Асоціації</h2><p>Зараз грає: <b>Команда 1</b></p><h1 style="font-size:72px">01:30</h1><p class="muted">Секретне слово глядачам не показуємо.</p>';
if(n===2)el.innerHTML='<h2>Раунд 2 · Кодові імена</h2><p class="muted">На екрані глядачів слова спочатку без кольорів. Натисни на будь-яке слово для прикладу відкриття картки.</p><div class="grid">'+words.map((w,i)=>'<button class="tile" data-color="'+(i===7?'black':i%3===0?'blue':i%3===1?'red':'neutral')+'" onclick="this.classList.toggle(this.dataset.color)">'+w+'</button>').join('')+'</div>';
if(n===3)el.innerHTML='<div class="desc">Рука тримати холодний камінь, камінь пити увага палець. Іноді камінь робити труси-труси, ніби всередині битися перелякане серце маленька миша.</div>';
if(n===4)el.innerHTML='<h2 style="text-align:center">Фінальні результати</h2><h1>🏆 Перемогли: Команда 2!</h1><p style="text-align:center" class="muted">Рахунок за всі три раунди — у двох блоках нижче.</p>';
}
setRound(1);
</script></body></html>
