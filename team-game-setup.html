<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Командна гра — створення</title><link rel="stylesheet" href="/css/style.css"></head>
<body><main class="shell"><div class="eyebrow">Party Game</div><h1>Командна гра</h1>
<section class="card narrow" id="login"><h2>Вхід для ведучої</h2><input id="password" type="password" placeholder="Пароль основної адмінки"><button id="loginBtn">Увійти</button></section>
<section class="card hidden" id="setup"><h2>Створити командну гру</h2>
<label>Назва гри<input id="title" value="Командна гра"></label>
<div class="grid2"><div><label>Перша команда<input id="team1" value="Команда 1"></label><label>Колір<input id="color1" type="color" value="#3e70b7"></label></div>
<div><label>Друга команда<input id="team2" value="Команда 2"></label><label>Колір<input id="color2" type="color" value="#bd5369"></label></div></div>
<div class="actions"><button id="create">Створити гру</button><button class="secondary" id="refresh">Оновити список</button></div>
<h2>Збережені командні ігри</h2><div id="games"></div></section>
<p id="message" class="muted" role="status"></p>
<p class="muted">Це перший робочий етап. Раунди й екрани гравців додамо окремо.</p>
</main><script type="module" src="/js/team-game-setup.js"></script></body></html>
